/* ---------- db bootstrap ---------- */
async function init(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  if(!db){ setStatus('Storage unavailable — changes won\'t be saved.'); }
  else { setStatus('Synced'); subscribe(); }
  render();
}

function subscribe(){
  db.collection('players').onSnapshot(snap=>{
    players = (snap.docs||[]).filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
    render();
  }, ()=> setStatus('Sync error — reload to retry'));
  db.collection('rounds').onSnapshot(snap=>{
    rounds = (snap.docs||[]).filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
    rounds.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    render();
  }, ()=> setStatus('Sync error — reload to retry'));
}

async function savePlayer(id, data){ if(!db) return; try{ await db.collection('players').doc(id).set(data); }catch(e){ setStatus('Could not save — try again'); } }
async function deletePlayerDoc(id){ if(!db) return; try{ await db.collection('players').doc(id).delete(); }catch(e){ setStatus('Could not remove — try again'); } }
async function saveRound(id, data){ if(!db) return; try{ await db.collection('rounds').doc(id).set(data); }catch(e){ setStatus('Could not save — try again'); } }
// Field-level update for live/in-progress rounds so two people photographing different
// teams at the same time can't clobber each other's writes with a whole-document overwrite.
async function updateRoundFields(id, fields){ if(!db) return; try{ await db.collection('rounds').doc(id).update(fields); }catch(e){ setStatus('Could not save — try again'); } }
async function deleteRoundDoc(id){ if(!db) return; try{ await db.collection('rounds').doc(id).delete(); }catch(e){ setStatus('Could not remove — try again'); } }

function currentLiveRound(){ return rounds.find(r=>r.complete===false); }
function finishedRounds(){ return rounds.filter(r=>r.complete!==false); }

/* ---------- routing ---------- */
function go(view, params={}){ route = {view, params}; renderTabs(); render(); window.scrollTo(0,0); }

function renderTabs(){

    if(group.includes(route.view)) b.classList.add('active');
    b.onclick = ()=> go(id);
    elWrap.appendChild(b);
  });
}

/* ---------- stats ---------- */
function playerAvg(pid){
  // rounds is already sorted newest-first by date; weight recent rounds more heavily
  // (0.6 decay per round back) so a hot or cold streak shows up faster than a flat average.
  const done = rounds.filter(r=>r.complete && r.scores && r.scores[pid] && r.scores[pid].gross);
  if(!done.length) return null;
  const decay = 0.6;
  let weightedSum=0, weightTotal=0;
  done.forEach((r,i)=>{
    const w = Math.pow(decay, i);
    weightedSum += Number(r.scores[pid].gross)*w;
    weightTotal += w;
  });
  return weightedSum/weightTotal;
}

function suggestTeams(playerIds, numTeams){
  const n = playerIds.length;
  const withAvg = playerIds.map(pid=>({pid, avg: playerAvg(pid)}));
  const known = withAvg.filter(p=>p.avg!==null).map(p=>p.avg);
  const fallback = known.length ? known.reduce((a,b)=>a+b,0)/known.length : 90;
  withAvg.forEach(p=>{ if(p.avg===null) p.avg = fallback; });
  withAvg.sort((a,b)=> a.avg - b.avg);
  const avgOf = pid => (withAvg.find(w=>w.pid===pid)||{}).avg;

  // Keep team sizes as equal as possible (differ by at most 1).
  const base = Math.floor(n/numTeams), rem = n%numTeams;
  const sizes = Array.from({length:numTeams}, (_,i)=> base + (i<rem?1:0));

  // Seed with a snake fill (low->high, high->low, ...) across the size-capped teams —
  // a good starting point for balanced sums.
  const teams = Array.from({length:numTeams}, ()=>({members:[], sum:0}));
  let idx = 0, dir = 1;
  const nextOpenSlot = ()=>{
    let guard = 0;
    while(teams[idx].members.length >= sizes[idx]){
      idx += dir;
      if(idx>=numTeams){ idx=numTeams-1; dir=-1; }
      if(idx<0){ idx=0; dir=1; }
      if(++guard>numTeams*2) break;
    }
  };
  withAvg.forEach(p=>{
    nextOpenSlot();
    teams[idx].members.push(p.pid);
    teams[idx].sum += p.avg;
    idx += dir;
    if(idx>=numTeams){ idx=numTeams-1; dir=-1; }
    if(idx<0){ idx=0; dir=1; }
  });

  // Local search: repeatedly swap one player between two teams (same sizes preserved)
  // whenever it tightens the gap between the highest and lowest team average.
  const teamAvg = t => t.sum / t.members.length;
  const spread = ()=>{ const avgs = teams.map(teamAvg); return Math.max(...avgs)-Math.min(...avgs); };
  let improved = true, iterations = 0;
  while(improved && iterations < 500){
    improved = false; iterations++;
    for(let i=0;i<numTeams && !improved;i++){
      for(let j=i+1;j<numTeams && !improved;j++){
        for(let a=0;a<teams[i].members.length && !improved;a++){
          for(let b=0;b<teams[j].members.length && !improved;b++){
            const pidA = teams[i].members[a], pidB = teams[j].members[b];
            const dA = avgOf(pidA), dB = avgOf(pidB);
            const before = spread();
            teams[i].members[a]=pidB; teams[j].members[b]=pidA;
            teams[i].sum += (dB-dA); teams[j].sum += (dA-dB);
            if(spread() < before - 1e-9){ improved = true; }
            else{ teams[i].members[a]=pidA; teams[j].members[b]=pidB; teams[i].sum -= (dB-dA); teams[j].sum -= (dA-dB); }
          }
        }
      }
    }
  }
  return teams;
}

function computeDots(round){
  const totals = {};
  round.playerIds.forEach(pid=>{ totals[pid] = Number((round.scores[pid]||{}).dots)||0; });
  const settlements = [];
  const ids = round.playerIds;
  for(let i=0;i<ids.length;i++){
    for(let j=i+1;j<ids.length;j++){
      const a=ids[i], b=ids[j];
      const diff = totals[a]-totals[b];
      if(diff===0) continue;
      const amount = Math.abs(diff)*0.25;
      if(diff>0) settlements.push({owes:b, owed:a, amount});
      else settlements.push({owes:a, owed:b, amount});
    }
  }
  return {totals, settlements};
}

function nameOf(round, pid){
  const rp = (round.roundPlayers||[]).find(p=>p.id===pid);
  if(rp) return rp.name;
  const p = players.find(p=>p.id===pid);
  return p ? p.name : 'Unknown';
}
function fmt$(n){ return (n<0?'-$':'$') + Math.abs(n).toFixed(2); }
function scoreOf(round, pid){
  const s = round.scores && round.scores[pid];
  return (s && typeof s.gross === 'number') ? s : {gross:0, dots:0};
}

/* ---------- scorecard photo import ---------- */
const PARSE_SCORECARD_URL = 'https://us-central1-golf-bet-tracker-cba58.cloudfunctions.net/parseScorecard';

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function matchRosterPlayer(name){
  if(!name) return null;
  const norm = String(name).trim().toLowerCase();
  return players.find(p=>p.name.trim().toLowerCase()===norm) || null;
}

// Given a batch of fully-unnamed rows from one photo, try to match them by row order
// against whichever ONE team's players are missing exactly this half -- scoped to a single
// team (not "anyone incomplete") so this doesn't misfire when multiple teams are mid-round
// at once. Only guesses when exactly one team's missing-count matches the row count;
// returns null (no guess) otherwise.
function guessRowsByRowOrder(rows, range, playersWithState){
  const byTeamPending = {};
  playersWithState.forEach(({pid, team, holes})=>{
    if(!team || !Array.isArray(holes)) return;
    let missing = false;
    for(let i=0;i<range.count;i++){ if(!(holes[range.startIdx+i]>0)){ missing = true; break; } }
    if(missing) (byTeamPending[team] = byTeamPending[team]||[]).push(pid);
  });
  const candidateTeams = Object.keys(byTeamPending).filter(t=> byTeamPending[t].length===rows.length);
  return candidateTeams.length===1 ? byTeamPending[candidateTeams[0]] : null;
}

function mergeRowHoles(row, st){
  const existing = row.assignedPlayerId && st.entries[row.assignedPlayerId] && Array.isArray(st.entries[row.assignedPlayerId].holes)
    ? st.entries[row.assignedPlayerId].holes : null;
  return Array.from({length:18}, (_,i)=>{
    if(row.photoHoles[i]!==null && row.photoHoles[i]!==undefined) return row.photoHoles[i];
    return existing ? (existing[i]||0) : 0;
  });
}

async function importScorecardPhoto(file, st){
  st.importStatus = 'reading';
  st.importError = null;
  render();
  try{
    const base64 = await fileToBase64(file);
    const rangeKey = st.holeRange || 'full';
    const range = HOLE_RANGE_INFO[rangeKey];
    const resp = await fetch(PARSE_SCORECARD_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({imageBase64: base64, mimeType: file.type||'image/jpeg', rosterNames: players.map(p=>p.name), holeRange: rangeKey})
    });
    const json = await resp.json();
    if(!resp.ok) throw new Error((json && json.error && (json.error.message||json.error))||'Import failed');
    const rows = (json.players||[]).map(p=>{
      const matched = matchRosterPlayer(p.matchedRosterName) || matchRosterPlayer(p.writtenName);
      const photoHoles = Array.from({length:18}, ()=>null);
      const readValues = p.holes||[];
      for(let i=0;i<range.count;i++){ photoHoles[range.startIdx+i] = Number(readValues[i])||0; }
      const row = { writtenName: p.writtenName||'?', assignedPlayerId: matched?matched.id:'', photoHoles, holes:null, guessedByOrder:false };
      row.holes = mergeRowHoles(row, st);
      return row;
    });
    // No names visible at all (common for a folded card's second half) — fall back to matching
    // by row order against whichever players are still missing exactly this half, since a photo's
    // row order matches the physical card and doesn't change between its front/back halves.
    if(rows.length && rows.every(r=>!r.assignedPlayerId)){
      const playersWithState = Object.keys(st.entries).map(pid=>({pid, team: st.entries[pid].team, holes: st.entries[pid].holes}));
      const pending = guessRowsByRowOrder(rows, range, playersWithState);
      if(pending){
        rows.forEach((row,i)=>{
          row.assignedPlayerId = pending[i];
          row.guessedByOrder = true;
          row.holes = mergeRowHoles(row, st);
        });
      }
    }
    st.importReview = { rows, notes: json.notes||'' };
    st.importStatus = null;
  }catch(e){
    st.importStatus = null;
    st.importError = 'Could not read that photo — ' + (e.message||'try again.');
  }
  render();
}

/* ---------- views ---------- */
function render(){
  renderTabs();
  const app = document.getElementById('app');
  app.innerHTML = '';
  try{
    if(route.view==='roster') return renderRoster(app);
    if(route.view==='new-round') return renderNewRound(app);
    if(route.view==='live-leaderboard') return renderLiveLeaderboard(app);
    if(route.view==='teams') return renderTeams(app);
    if(route.view==='team-results') return renderTeamResults(app);
    if(route.view==='history') return renderHistory(app);
    if(route.view==='player-history') return renderPlayerHistory(app);
    if(route.view==='round-summary') return renderRoundSummary(app);
    renderRoster(app);
  }catch(err){
    app.innerHTML = '';
    app.appendChild(el('div',{class:'card'},[
      el('div',{style:'font-weight:700;margin-bottom:6px;'},'Something went wrong displaying this page.'),
      el('button',{class:'btn secondary',onclick:()=>go('roster')},'Back to Roster')
    ]));
  }
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='class') e.className = v;
    else if(typeof v==='boolean') e[k] = v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

// Native confirm()/alert() don't reliably fire inside a published artifact's sandboxed
// frame, so destructive actions use this two-step inline confirm instead.
function confirmAction(key, label, onConfirm, confirmText){
  if(!window.__pendingConfirm) window.__pendingConfirm = new Set();
  const pending = window.__pendingConfirm;
  if(pending.has(key)){
    return el('span',{style:'display:inline-flex;gap:10px;align-items:center;'},[
      el('span',{style:'font-size:12.5px;color:var(--danger);font-weight:700;'}, confirmText||'Delete?'),
      el('button',{class:'link-btn',style:'color:var(--danger);',onclick:async(e)=>{ e.stopPropagation(); pending.delete(key); await onConfirm(); }},'Yes'),
      el('button',{class:'link-btn',onclick:(e)=>{ e.stopPropagation(); pending.delete(key); render(); }},'Cancel')
    ]);
  }
  return el('button',{class:'link-btn',style:'color:var(--danger);',onclick:(e)=>{ e.stopPropagation(); pending.add(key); render(); }}, label);
}

function renderRoster(app){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Add a player'));
  const inp = el('input',{type:'text',id:'newPlayerName',placeholder:'Player name'});
  const form = el('div',{class:'row',style:'gap:8px;'},[
    inp,

/* ---------- live leaderboard import (writes straight to Firestore per player, so two
   people photographing different teams at the same time don't clobber each other) ---------- */
function blankLiveImportState(){
  return { holeRange:null, importStatus:null, importError:null, importReview:null };
}

function defaultHoleRangeLive(round){
  const scores = round.scores || {};
  for(const pid in scores){
    const holes = scores[pid].holes;
    if(!Array.isArray(holes)) continue;
    const frontDone = holes.slice(0,9).every(h=>h>0);
    const backDone = holes.slice(9,18).every(h=>h>0);
    if(frontDone && !backDone) return 'back';
    if(backDone && !frontDone) return 'front';
  }
  return 'front';
}

function mergeRowHolesLive(row, round){
  const existing = row.assignedPlayerId && round.scores && round.scores[row.assignedPlayerId] && Array.isArray(round.scores[row.assignedPlayerId].holes)
    ? round.scores[row.assignedPlayerId].holes : null;
  return Array.from({length:18}, (_,i)=>{
    if(row.photoHoles[i]!==null && row.photoHoles[i]!==undefined) return row.photoHoles[i];
    return existing ? (existing[i]||0) : 0;
  });
}

async function importScorecardPhotoLive(file, ls, round){
  ls.importStatus = 'reading';
  ls.importError = null;
  render();
  try{
    const base64 = await fileToBase64(file);
    const rangeKey = ls.holeRange || 'full';
    const range = HOLE_RANGE_INFO[rangeKey];
    const resp = await fetch(PARSE_SCORECARD_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({imageBase64: base64, mimeType: file.type||'image/jpeg', rosterNames: players.map(p=>p.name), holeRange: rangeKey})
    });
    const json = await resp.json();
    if(!resp.ok) throw new Error((json && json.error && (json.error.message||json.error))||'Import failed');
    const rows = (json.players||[]).map(p=>{
      const matched = matchRosterPlayer(p.matchedRosterName) || matchRosterPlayer(p.writtenName);
      const photoHoles = Array.from({length:18}, ()=>null);
      const readValues = p.holes||[];
      for(let i=0;i<range.count;i++){ photoHoles[range.startIdx+i] = Number(readValues[i])||0; }
      const row = { writtenName: p.writtenName||'?', assignedPlayerId: matched?matched.id:'', photoHoles, holes:null, guessedByOrder:false };
      row.holes = mergeRowHolesLive(row, round);
      return row;
    });
    if(rows.length && rows.every(r=>!r.assignedPlayerId)){
      const playersWithState = (round.playerIds||[]).map(pid=>({pid, team: round.scores[pid] && round.scores[pid].team, holes: round.scores[pid] && round.scores[pid].holes}));
      const pending = guessRowsByRowOrder(rows, range, playersWithState);
      if(pending){
        rows.forEach((row,i)=>{
          row.assignedPlayerId = pending[i];
          row.guessedByOrder = true;
          row.holes = mergeRowHolesLive(row, round);
        });
      }
    }
    ls.importReview = { rows, notes: json.notes||'' };
    ls.importStatus = null;
  }catch(e){
    ls.importStatus = null;
    ls.importError = 'Could not read that photo — ' + (e.message||'try again.');
  }
  render();
}

function liveKnownTeams(round){
  const known = {};
  (round.playerIds||[]).forEach(pid=>{ const t = round.scores[pid] && round.scores[pid].team; if(t) known[pid]=t; });
  return known;
}

// Team each review row will go to: the user's pick if they made one, else the player's
// existing team, else the team of another already-known player on this photo, else a new team.
function liveRowTeam(row, rows, round){
  if(row.team) return row.team;
  const known = liveKnownTeams(round);
  if(known[row.assignedPlayerId]) return known[row.assignedPlayerId];
  const sibling = rows.find(r=>r.assignedPlayerId && known[r.assignedPlayerId]);
  if(sibling) return known[sibling.assignedPlayerId];
  return Math.max(0, ...Object.values(known)) + 1;
}

// Writes reviewed rows inside a transaction so teams and existing holes come from the
// latest server copy of the round, not this phone's possibly stale one (another card
// added a moment ago, or the page catching up after the camera app).
function buildLiveRowFields(rows, round){
  const fields = {};
  const newIds = [];
  const newRoundPlayers = [];
  rows.forEach(row=>{
    if(!row.assignedPlayerId) return;
    const pid = row.assignedPlayerId;
    const prior = (round.scores && round.scores[pid]) || {};
    const priorHoles = Array.isArray(prior.holes) ? prior.holes : [];
    const holes = row.holes.map((v,i)=> v>0 ? v : (priorHoles[i]||0));
    const gross = holes.reduce((a,b)=>a+b,0);
    const team = liveRowTeam(row, rows, round);
    fields['scores.'+pid] = { ...prior, gross, holes, team };
    newIds.push(pid);
    const p = players.find(pp=>pp.id===pid);
    newRoundPlayers.push({id:pid, name: p?p.name:'?'});
  });
  if(!newIds.length) return null;
  fields.playerIds = firebase.firestore.FieldValue.arrayUnion(...newIds);
  fields.roundPlayers = firebase.firestore.FieldValue.arrayUnion(...newRoundPlayers);
  return fields;
}

async function addLiveRows(roundId, rows){
  if(!db) return false;
  const ref = db.collection('rounds').doc(roundId);
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists) throw new Error('Round not found');
      const fresh = {id: snap.id, scores:{}, ...snap.data()};
      const fields = buildLiveRowFields(rows, fresh);
      if(fields) tx.update(ref, fields);
    });
    return true;
  }catch(e){
    setStatus('Could not save — try again');
    return false;
  }
}

const HOLE_RANGE_INFO = {
  front: {startIdx:0, count:9, label:'Front 9 (holes 1–9)'},
  back: {startIdx:9, count:9, label:'Back 9 (holes 10–18)'},
  full: {startIdx:0, count:18, label:'Full 18'}
};

function defaultHoleRange(st){
  for(const pid in st.entries){
    const holes = st.entries[pid].holes;
    if(!Array.isArray(holes)) continue;
    const frontDone = holes.slice(0,9).every(h=>h>0);
    const backDone = holes.slice(9,18).every(h=>h>0);
    if(frontDone && !backDone) return 'back';
    if(backDone && !frontDone) return 'front';
  }
  return 'front';
}

    gInput.onchange = e=>{ st.entries[p.id] = {...st.entries[p.id], gross: e.target.value===''?'':Number(e.target.value)}; };
    rowEl.appendChild(gInput);

    const dInput = el('input',{type:'number',inputmode:'numeric',min:'0',placeholder:'–',class:'cell-input'});
    dInput.value = entry.dots===undefined ? '' : entry.dots;
    dInput.disabled = !st.selected.has(p.id);
    dInput.onchange = e=>{ st.entries[p.id] = {...st.entries[p.id], dots: e.target.value===''?0:Number(e.target.value)}; };
    rowEl.appendChild(dInput);

    const grInput = el('input',{type:'number',inputmode:'numeric',min:'0',placeholder:'–',class:'cell-input'});
    grInput.value = entry.greenies===undefined ? '' : entry.greenies;
    grInput.disabled = !st.selected.has(p.id);
    grInput.onchange = e=>{ st.entries[p.id] = {...st.entries[p.id], greenies: e.target.value===''?0:Number(e.target.value)}; };
    rowEl.appendChild(grInput);

    card.appendChild(rowEl);
  });
  app.appendChild(card);

  const doSaveRound = async ()=>{
    const ids = [...st.selected];
    st.error = null;
    if(ids.length<2){ st.error = 'Check in at least two players.'; render(); return; }
    const missing = ids.filter(pid => st.entries[pid]===undefined || st.entries[pid].gross===undefined || st.entries[pid].gross==='');
    if(missing.length){ st.error = 'Enter a gross score for every checked-in player.'; render(); return; }
    const roundId = st.editingId || uid();
    const roundPlayers = ids.map(pid=>({id:pid, name:(players.find(p=>p.id===pid)||{}).name||'?'}));
    const scores = {};
    ids.forEach(pid=>{
      scores[pid] = { gross: Number(st.entries[pid].gross), dots: Number(st.entries[pid].dots)||0, greenies: Number(st.entries[pid].greenies)||0 };
      if(Array.isArray(st.entries[pid].holes)) scores[pid].holes = st.entries[pid].holes;
      if(st.entries[pid].team) scores[pid].team = Number(st.entries[pid].team);
    });
    await saveRound(roundId, { date: st.date, course: (st.course||'').trim(), playerIds: ids, roundPlayers, scores, complete:true });
    window.__newRoundState = null;
    go('round-summary', {id: roundId});
  };

  let saveBtn;
  if(isCompletingLive){
    const pendingKey = 'complete-live-'+st.editingId;
    if(!window.__pendingConfirm) window.__pendingConfirm = new Set();
    if(window.__pendingConfirm.has(pendingKey)){
      saveBtn = el('div',{},[
        el('div',{style:'color:var(--danger);font-weight:700;text-align:center;margin-bottom:8px;'},'This will end the round for all players and teams. Are you sure?'),
        el('div',{style:'display:flex;gap:10px;'},[
          el('button',{class:'btn danger',style:'flex:1;',onclick: async()=>{ window.__pendingConfirm.delete(pendingKey); await doSaveRound(); }},'Yes, complete round'),
          el('button',{class:'btn ghost',style:'flex:1;',onclick:()=>{ window.__pendingConfirm.delete(pendingKey); render(); }},'Cancel')
        ])
      ]);
    } else {
      saveBtn = el('button',{class:'btn',style:'width:100%;',onclick:()=>{ window.__pendingConfirm.add(pendingKey); render(); }},'Complete round');
    }
  } else {
    saveBtn = el('button',{class:'btn',style:'width:100%;',onclick:doSaveRound}, st.editingId ? 'Save changes' : 'Save round');
  }
  const incomplete = [...st.selected].filter(pid=>{
    const h = st.entries[pid] && st.entries[pid].holes;
    return Array.isArray(h) && h.some(v=>v>0) && h.some(v=>!(v>0));
  });
  if(incomplete.length){
    const names = incomplete.map(pid=>{
      const filled = st.entries[pid].holes.filter(v=>v>0).length;
      return `${(players.find(p=>p.id===pid)||{}).name||'?'} (${filled}/18)`;
    }).join(', ');
    app.appendChild(el('div',{class:'small-note',style:'color:var(--gold);margin-bottom:8px;text-align:center;'}, `Incomplete hole data — ${names}. You can still save, but Team Results won't have a winner until every hole is filled in.`));
  }
  if(st.error) app.appendChild(el('div',{style:'color:var(--danger);font-weight:600;font-size:13.5px;margin-bottom:8px;text-align:center;'}, st.error));
  app.appendChild(saveBtn);
}

function validHoles(h){
  return Array.isArray(h) && h.length===18 && h.every(v=>Number(v)>0);
}

function computeTeamResults(round){
  const ids = round.playerIds||[];
  const holesOf = pid => (round.scores && round.scores[pid] && round.scores[pid].holes);

  const byTeam = {};
  const noTeam = [];
  ids.forEach(pid=>{
    const t = round.scores[pid] && round.scores[pid].team;
    if(t) (byTeam[t] = byTeam[t]||[]).push(pid); else noTeam.push(pid);
  });
  const nums = Object.keys(byTeam).map(Number).sort((a,b)=>a-b);
  if(nums.length<2) return {status:'no-teams'};

  // Per hole, per team: the lowest valid (>0) score among that team's players who have a
  // value for that hole so far. A hole only counts toward the running totals once every
  // team has at least one player's value for it -- this lets a round in progress show a
  // live partial result (through however many holes are actually known) using the exact
  // same logic that produces the final result once all 18 holes are in for everyone.
  const teamHoleLow = {};
  nums.forEach(num=>{ teamHoleLow[num] = Array(18).fill(null); });
  for(let h=0; h<18; h++){
    nums.forEach(num=>{
      const vals = byTeam[num]
        .map(pid=>{ const hs=holesOf(pid); const v = hs && Number(hs[h]); return v>0 ? v : null; })
        .filter(v=>v!==null);
      teamHoleLow[num][h] = vals.length ? Math.min(...vals) : null;
    });
  }
  const knownHoles = [];
  for(let h=0; h<18; h++){ if(nums.every(num=>teamHoleLow[num][h]!==null)) knownHoles.push(h); }
  if(!knownHoles.length) return {status:'needs-holes'};

  const teams = nums.map(num=>{
    const lows = Array.from({length:18}, (_,h)=>{
      if(teamHoleLow[num][h]===null) return null;
      const score = teamHoleLow[num][h];
      return { score, who: byTeam[num].filter(pid=>{ const hs=holesOf(pid); return hs && Number(hs[h])===score; }) };
    });
    const sumKnown = (from,to)=> knownHoles.filter(h=>h>=from && h<to).reduce((s,h)=>s+lows[h].score,0);
    return { num, players: byTeam[num], lows, front: sumKnown(0,9), back: sumKnown(9,18), total: sumKnown(0,18), skins: [] };
  });
  let tiedHoles = 0;
  knownHoles.forEach(h=>{
    const best = Math.min(...teams.map(t=>t.lows[h].score));
    const winners = teams.filter(t=>t.lows[h].score===best);
    if(winners.length===1) winners[0].skins.push(h+1); else tiedHoles++;
  });
  return {status:'ok', teams, tiedHoles, noTeam, knownHolesCount: knownHoles.length, complete: knownHoles.length===18};
}

function computeBets(round, res){
  const BUY_IN = 5, REFUND = 2, GREENIE_PER_PLAYER = 0.25;
  const roundToQuarter = x=> Math.round(x/0.25)*0.25;
  const ids = round.playerIds||[];
  const n = ids.length;
  const greenieValue = GREENIE_PER_PLAYER * n;
  const pot = BUY_IN * n;

  const lowest = Math.min(...res.teams.map(t=>t.total));
  const leaders = res.teams.filter(t=>t.total===lowest);
  const winner = leaders.length===1 ? leaders[0] : null;
  const refundTotal = winner ? winner.players.length * REFUND : 0;
  const greenieOf = pid => Number(round.scores[pid].greenies)||0;
  const greenieCount = ids.reduce((s,pid)=>s+greenieOf(pid),0);
  const greenieTotal = greenieCount * greenieValue;
  const remaining = pot - refundTotal - greenieTotal;
  const totalSkins = res.teams.reduce((s,t)=>s+t.skins.length,0);
  const skinValue = totalSkins ? remaining / totalSkins : 0;

  // Refund ($2 increments) and greenies ($0.25 x player count) are always already exact
  // multiples of a quarter. Only the skins split can land on an odd fraction, so round each
  // player's exact skin share to the nearest quarter, then hand out (or claw back) whatever
  // quarters are left over to whoever's rounded furthest from their exact share -- the
  // standard largest-remainder method -- so the skins total always lands exactly on
  // `remaining` and every payout stays a clean quarter.
  const exactSkinOf = pid=>{
    if(!totalSkins) return remaining / n;
    const team = res.teams.find(t=>t.players.includes(pid));
    return team ? skinValue * team.skins.length / team.players.length : 0;
  };
  const skinShares = ids.map(pid=>{ const exact = exactSkinOf(pid); const rounded = roundToQuarter(exact); return {pid, exact, rounded}; });
  const sumRounded = skinShares.reduce((s,x)=>s+x.rounded,0);
  let diffQuarters = Math.round((remaining - sumRounded)/0.25);
  const byRemainder = skinShares.map((x,i)=>({i, remainder: x.exact-x.rounded})).sort((a,b)=> diffQuarters>0 ? b.remainder-a.remainder : a.remainder-b.remainder);
  for(let k=0;k<Math.abs(diffQuarters);k++){ skinShares[byRemainder[k].i].rounded += diffQuarters>0 ? 0.25 : -0.25; }
  const skinOf = {};
  skinShares.forEach(x=> skinOf[x.pid] = x.rounded);

  const rows = ids.map(pid=>{
    const team = res.teams.find(t=>t.players.includes(pid));
    const refund = winner && team===winner ? REFUND : 0;
    const greenie = roundToQuarter(greenieOf(pid) * greenieValue);
    const skins = skinOf[pid];
    const payout = roundToQuarter(refund + greenie + skins);
    return { pid, team: team ? team.num : null, refund, greenie, skins, payout, net: roundToQuarter(payout - BUY_IN) };
  }).sort((a,b)=> (a.team||99)-(b.team||99) || nameOf(round,a.pid).localeCompare(nameOf(round,b.pid)));

  const sum = k => roundToQuarter(rows.reduce((s,r)=>s+r[k],0));
  const totals = { refund: sum('refund'), greenie: sum('greenie'), skins: sum('skins'), payout: sum('payout'), net: sum('net') };
  const $ = x => '$' + x.toFixed(2);
  const steps = [
    `Pot: ${n} players × $${BUY_IN} = ${$(pot)}`,
    winner
      ? `Winning team refund: Team ${winner.num} (${winner.players.length} members × $${REFUND}) = ${$(refundTotal)}`
      : 'Team score tied: no refund paid',
    `Greenies: ${greenieCount} × ${$(greenieValue)} ($0.25 × ${n} players) = ${$(greenieTotal)}`,
    `Remaining for skins: ${$(remaining)}`,
    totalSkins
      ? `Skin value: ${$(remaining)} ÷ ${totalSkins} skins = ${$(skinValue)} (${res.teams.map(t=>`Team ${t.num}: ${t.skins.length}`).join(', ')}), rounded to the nearest quarter so payouts add up exactly`
      : `No skins earned: ${$(remaining)} split evenly among all ${n} players, rounded to the nearest quarter`
  ];
  const roundingNote = Math.abs(totals.payout - pot) > 0.005 ? `Payouts differ from the pot by ${$(Math.abs(totals.payout - pot))} due to rounding.` : '';
  return { rows, sum: totals, steps, roundingNote };
}

function renderTeamResults(app){
  const rlist = finishedRounds();
  if(!rlist.length){
    app.appendChild(el('div',{class:'card'},el('div',{class:'empty'},'No completed rounds yet — finish a round to see results here.')));
    return;
  }
  if(!window.__teamResultsState) window.__teamResultsState = {roundId:null, open:{bets:true, holes:false}};
  const st = window.__teamResultsState;
  const round = rlist.find(r=>r.id===st.roundId) || rlist[0];

  const pickCard = el('div',{class:'card'});
  pickCard.appendChild(el('h3',{},'Team Results'));
  const sel = el('select',{});
  rlist.forEach(r=>{
    const o = el('option',{value:r.id}, r.course ? `${r.date} — ${r.course}` : r.date);
    if(r.id===round.id) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = e=>{ st.roundId = e.target.value; render(); };
  pickCard.appendChild(el('div',{class:'field',style:'margin-bottom:0;'},[el('label',{},'Round'), sel]));
  app.appendChild(pickCard);

  const res = computeTeamResults(round);
  if(res.status!=='ok'){
    const msg = res.status==='no-teams'
      ? 'This round needs at least two teams. Set the Team column by editing the round.'
      : 'No hole-by-hole scores yet for this round.';
    app.appendChild(el('div',{class:'card'},el('div',{class:'empty'},msg)));
    return;
  }

  const lowestTotal = Math.min(...res.teams.map(t=>t.total));
  const leaders = res.teams.filter(t=>t.total===lowestTotal);

  const scoreCard = el('div',{class:'card'});
  scoreCard.appendChild(el('h3',{},'Team score and skins'));
  if(!res.complete) scoreCard.appendChild(el('div',{class:'small-note',style:'color:var(--gold);margin-bottom:8px;'}, `Through ${res.knownHolesCount} of 18 holes — this round isn't fully scored yet.`));
  const sTable = el('table',{class:'results'});
  sTable.appendChild(el('tr',{},[el('th',{},'Team'), el('th',{},'Score'), el('th',{},'Skins')]));
  res.teams.forEach(t=>{
    const isLeader = t.total===lowestTotal;
    const tag = isLeader ? el('span',{class:'badge complete',style:'margin-left:8px;'}, leaders.length>1 ? 'Tie' : 'Winner') : null;
    sTable.appendChild(el('tr',{},[
      el('td',{},[el('div',{style:'font-weight:700;'},['Team '+t.num, tag]), el('div',{class:'muted',style:'font-size:12px;'}, t.players.map(pid=>nameOf(round,pid)).join(', '))]),
      el('td',{style:'font-weight:700;'}, String(t.total)),
      el('td',{style:'font-weight:700;'}, String(t.skins.length))
    ]));
  });
  scoreCard.appendChild(sTable);
  res.teams.forEach(t=>{
    scoreCard.appendChild(el('div',{style:'margin-top:10px;font-size:14px;'},[
      el('span',{style:'font-weight:700;'}, `Team ${t.num} skins: `),
      document.createTextNode(t.skins.length ? 'holes ' + t.skins.join(', ') : 'none')
    ]));
  });
  scoreCard.appendChild(el('div',{class:'small-note',style:'margin-top:8px;'}, `${res.tiedHoles} tied hole${res.tiedHoles===1?'':'s'} (no skin).`));
  if(res.noTeam.length) scoreCard.appendChild(el('div',{class:'small-note'}, 'Not on a team: ' + res.noTeam.map(pid=>nameOf(round,pid)).join(', ') + '.'));
  app.appendChild(scoreCard);

  const collapsible = (title, key, children)=>{
    const d = el('details',{class:'card'});
    d.open = !!st.open[key];
    d.addEventListener('toggle', ()=>{ st.open[key] = d.open; });
    d.appendChild(el('summary',{}, title));
    children.forEach(c=>d.appendChild(c));
    return d;
  };

  const bets = computeBets(round, res);
  const money = n=> n.toFixed(2);
  const signed = n=> (n<0 ? '−' : '+') + Math.abs(n).toFixed(2);
  const cell = (txt, style)=> el('td',{style:'padding:6px 2px;white-space:nowrap;' + (style||'')}, txt);
  const head = txt=> el('th',{style:'padding:0 2px 6px;white-space:nowrap;font-size:11px;'}, txt);
  const calc = el('div',{style:'font-size:13.5px;line-height:1.6;margin-bottom:10px;'});
  bets.steps.forEach(s=> calc.appendChild(el('div',{}, s)));
  const bTable = el('table',{class:'results',style:'font-size:13px;'});
  bTable.appendChild(el('tr',{},[head('Player'), head('Team'), head('Refund'), head('Greenies'), head('Skins'), head('Payout'), head('Net')]));
  bets.rows.forEach(r=>{
    bTable.appendChild(el('tr',{},[
      cell(nameOf(round,r.pid), 'font-weight:600;'), cell(r.team ? 'T'+r.team : '–'), cell(money(r.refund)), cell(money(r.greenie)), cell(money(r.skins)),
      cell(money(r.payout), 'font-weight:700;'),
      el('td',{class: r.net<0 ? 'money-neg' : 'money-pos', style:'padding:6px 2px;white-space:nowrap;'}, signed(r.net))
    ]));
  });
  bTable.appendChild(el('tr',{style:'font-weight:700;'},[cell('Total'), cell(''), cell(money(bets.sum.refund)), cell(money(bets.sum.greenie)), cell(money(bets.sum.skins)), cell(money(bets.sum.payout)), cell(signed(bets.sum.net))]));
  const bWrap = el('div',{style:'overflow-x:auto;'}, bTable);
  const betKids = [calc, bWrap, el('div',{class:'small-note',style:'margin-top:6px;'},'Amounts in dollars. Net = payout minus the $5 buy-in.')];
  if(bets.roundingNote) betKids.push(el('div',{class:'small-note',style:'margin-top:8px;'}, bets.roundingNote));
  app.appendChild(collapsible('Betting payouts', 'bets', betKids));

  const holeCard = el('div',{});
  holeCard.appendChild(el('div',{class:'small-note',style:'margin-bottom:8px;'},'Lowest score on each team per hole. A filled score means that team won the hole (a skin).'));
  const wrap = el('div',{style:'overflow-x:auto;'});
  const hTable = el('table',{class:'results'});
  hTable.appendChild(el('tr',{},[el('th',{},'Hole'), ...res.teams.map(t=>el('th',{},'Team '+t.num))]));
  const totalsRow = (label, key)=> el('tr',{style:'font-weight:700;'},[el('td',{},label), ...res.teams.map(t=>el('td',{},String(t[key])))]);
  for(let h=0; h<18; h++){
    hTable.appendChild(el('tr',{},[
      el('td',{},String(h+1)),
      ...res.teams.map(t=>{
        if(!t.lows[h]) return el('td',{style:'padding-right:8px;'},[el('div',{class:'muted'},'–')]);
        const won = t.skins.includes(h+1);
        return el('td',{style:'padding-right:8px;'},[
          el('div',{style: won ? 'display:inline-block;min-width:24px;text-align:center;background:var(--fairway);color:#fff;border-radius:999px;padding:1px 8px;font-weight:700;' : 'font-weight:600;'}, String(t.lows[h].score)),
          el('div',{class:'muted',style:'font-size:11px;line-height:1.2;'}, t.lows[h].who.map(pid=>nameOf(round,pid)).join('/'))
        ]);
      })
    ]));
    if(h===8) hTable.appendChild(totalsRow('OUT','front'));
  }
  hTable.appendChild(totalsRow('IN','back'));
  hTable.appendChild(totalsRow('TOTAL','total'));
  wrap.appendChild(hTable);
  holeCard.appendChild(wrap);
  app.appendChild(collapsible('Hole by hole', 'holes', [holeCard]));
}

      const holes = Array.isArray(s.holes) ? s.holes : [];
      const played = holes.filter(h=>h>0);
      return { pid, team: s.team, holesPlayed: played.length, total: played.reduce((a,b)=>a+b,0) };
    }).sort((a,b)=> b.holesPlayed - a.holesPlayed || a.total - b.total);
    const iTable = el('table',{class:'results'});
    iTable.appendChild(el('tr',{},[el('th',{},'Player'), el('th',{},'Team'), el('th',{},'Holes'), el('th',{},'Score so far')]));
    const maxTeam = Math.max(0, ...rows.map(r=>r.team||0));
    rows.forEach(r=>{
      const tSel = el('select',{class:'team-select',style:'width:auto;min-width:52px;'});
      tSel.appendChild(el('option',{value:''},'–'));
      for(let n=1; n<=maxTeam+1; n++){
        const o = el('option',{value:n}, 'T'+n);
        if(n===r.team) o.selected = true;
        tSel.appendChild(o);
      }
      tSel.onchange = e=>{
        const n = Number(e.target.value);
        updateRoundFields(round.id, {['scores.'+r.pid+'.team']: n || firebase.firestore.FieldValue.delete()});
      };
      iTable.appendChild(el('tr',{},[
        el('td',{style:'font-weight:600;'}, nameOf(round,r.pid)),
        el('td',{}, tSel),
        el('td',{}, r.holesPlayed ? `${r.holesPlayed}/18` : '–'),
        el('td',{style:'font-weight:700;'}, r.holesPlayed ? String(r.total) : '–')
      ]));
    });
    indCard.appendChild(iTable);
    indCard.appendChild(el('div',{class:'small-note',style:'margin-top:8px;'},'Scores aren\'t directly comparable until everyone\'s played the same number of holes.'));
  }
  app.appendChild(indCard);

  app.appendChild(el('button',{class:'btn secondary',style:'width:100%;',onclick:()=>{ editRound(round); }},'Review & complete round'));
}

function renderTeams(app){
  if(players.length<2){
    app.appendChild(el('div',{class:'card'},el('div',{class:'empty'},'Add at least two players to the roster first.')));
    return;
  }
  if(!window.__teamsState){
    window.__teamsState = { selected:new Set(), numTeams:2, assignment:null };
  }
  const st = window.__teamsState;

  const pickCard = el('div',{class:'card'});
  pickCard.appendChild(el('h3',{},'Who\'s playing next?'));
  players.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    const avg = playerAvg(p.id);
    const line = el('label',{class:'player-line',style:'cursor:pointer;'});
    const cb = el('input',{type:'checkbox'});
    cb.checked = st.selected.has(p.id);
    cb.onchange = ()=>{ if(cb.checked) st.selected.add(p.id); else st.selected.delete(p.id); st.assignment=null; render(); };
    line.appendChild(el('div',{style:'display:flex;align-items:center;gap:10px;'},[cb, el('span',{},p.name)]));
    line.appendChild(el('span',{class:'muted'}, avg!==null?`avg ${avg.toFixed(1)}`:'—'));
    pickCard.appendChild(line);
  });
  app.appendChild(pickCard);

  const ctrlCard = el('div',{class:'card'});
  ctrlCard.appendChild(el('h3',{},'Teams'));
  ctrlCard.appendChild(el('div',{class:'small-note',style:'margin-bottom:10px;'},'Balances by average gross score, weighted toward recent rounds. Drag isn\'t supported — use the dropdown next to a player to move them after suggesting.'));
  const controlRow = el('div',{class:'row'},[
    el('div',{class:'field',style:'flex:1;margin-bottom:0;'},[
      el('label',{},'Number of teams'),
      (()=>{ const sel = el('select',{}); [2,3].forEach(n=>{ const o=el('option',{value:n},String(n)); if(n===st.numTeams) o.selected=true; sel.appendChild(o); }); sel.onchange=e=>{ st.numTeams=Number(e.target.value); st.assignment=null; render(); }; return sel; })()
    ]),
    el('button',{class:'btn',style:'margin-top:18px;',onclick:()=>{
      const ids = [...st.selected];
      if(ids.length<2){ st.pickError='Check in at least two players.'; render(); return; }
      st.pickError=null;
      const teamsArr = suggestTeams(ids, st.numTeams);
      const assignment = {};
      teamsArr.forEach((t,idx)=> t.members.forEach(pid=> assignment[pid]=idx));
      st.assignment = assignment;
      render();
    }},'Suggest teams')
  ]);
  ctrlCard.appendChild(controlRow);
  if(st.pickError) ctrlCard.appendChild(el('div',{style:'color:var(--danger);font-weight:600;font-size:13.5px;'}, st.pickError));
  app.appendChild(ctrlCard);

  if(st.assignment){
    const ids = [...st.selected];
    const groups = Array.from({length:st.numTeams}, ()=>[]);
    ids.forEach(pid=>{
      const idx = st.assignment[pid];
      if(idx!==undefined && idx>=0 && idx<st.numTeams) groups[idx].push(pid);
      else groups[0].push(pid);
    });
    const resultsCard = el('div',{class:'card'});
    groups.forEach((members, idx)=>{
      const avgs = members.map(pid=>playerAvg(pid)).filter(a=>a!==null);
      const teamAvg = avgs.length ? avgs.reduce((a,b)=>a+b,0)/avgs.length : null;
      const block = el('div',{class:'team-block'});
      block.appendChild(el('div',{class:'row',style:'margin-bottom:2px;'},[
        el('h4',{style:'margin:0;'},`Team ${idx+1}`),
        el('span',{class:'muted',style:'font-weight:700;'}, teamAvg!==null ? `avg ${teamAvg.toFixed(1)}` : '—')
      ]));
      members.slice().sort((a,b)=>{
        const avgA = playerAvg(a), avgB = playerAvg(b);
        if(avgA===null && avgB===null) return 0;
        if(avgA===null) return 1;
        if(avgB===null) return -1;
        return avgA-avgB;
      }).forEach(pid=>{
        const p = players.find(pp=>pp.id===pid);
        const avg = playerAvg(pid);
        const rowEl = el('div',{class:'row',style:'padding:3px 0;'},[
          el('span',{}, p?p.name:'?'),
          el('div',{style:'display:flex;align-items:center;gap:8px;'},[
            el('span',{class:'muted'}, avg!==null?avg.toFixed(1):'—'),
            (()=>{
              const sel = el('select',{style:'width:auto;padding:4px 6px;font-size:12px;'});
              for(let i=0;i<st.numTeams;i++){ const o=el('option',{value:i}, `T${i+1}`); if(i===idx) o.selected=true; sel.appendChild(o); }
              sel.onchange = e=>{ st.assignment[pid]=Number(e.target.value); render(); };
              return sel;
            })()
          ])
        ]);
        block.appendChild(rowEl);
      });
      resultsCard.appendChild(block);
    });
    app.appendChild(resultsCard);
  }
}

function renderHistory(app){
  app.appendChild(el('h3',{style:'margin-bottom:8px;'},'Round History'));
  const rlist = finishedRounds();
  if(!rlist.length){
    app.appendChild(el('div',{class:'card'},el('div',{class:'empty'},'No completed rounds yet — start one from the Start Round tab.')));
    return;
  }
  if(!window.__historyExpanded) window.__historyExpanded = new Set();
  const expanded = window.__historyExpanded;
  rlist.forEach(r=>{
    try{
      const isOpen = expanded.has(r.id);
      const card = el('div',{class:'card'});
      const titleLine = r.course ? `${r.date} — ${r.course}` : r.date;
      const hasTeams = (r.playerIds||[]).some(pid=>scoreOf(r,pid).team);
      const tr = hasTeams ? computeTeamResults(r) : null;
      let winnerNum = null, resultText = '', shortResult = '';
      if(tr && tr.status==='ok' && tr.complete){
        const byTotal = tr.teams.slice().sort((a,b)=>a.total-b.total);
        const leaders = byTotal.filter(t=>t.total===byTotal[0].total);
        const scoreText = byTotal.map(t=>t.total).join('–');
        if(leaders.length===1){
          winnerNum = leaders[0].num;
          resultText = `Winning team: Team ${winnerNum} (${scoreText})`;
          shortResult = `Team ${winnerNum} won`;
        } else {
          resultText = `Team score tied (${scoreText})`;
          shortResult = 'Team score tied';
        }
      } else if(tr && tr.status==='ok'){
        resultText = `Team winner: through ${tr.knownHolesCount} of 18 holes only.`;
        shortResult = `${tr.knownHolesCount}/18 holes scored`;
      } else if(tr){
        resultText = 'Team winner needs hole by hole scores for every team member.';
      }
      const headerRow = el('div',{class:'row round-item',onclick:()=>{ if(isOpen) expanded.delete(r.id); else expanded.add(r.id); render(); }},[
        el('div',{},[
          el('div',{style:'font-weight:700;'}, titleLine),
          el('div',{class:'muted'}, `${(r.playerIds||[]).length} players` + (shortResult ? ` · ${shortResult}` : ''))
        ]),
        el('span',{class:'muted'}, isOpen ? '▲' : '▼')
      ]);
      card.appendChild(headerRow);
      if(isOpen){
        const table = el('table',{class:'results',style:'margin-top:10px;'});
        table.appendChild(el('tr',{},[el('th',{},'Player'), ...(hasTeams ? [el('th',{},'Team')] : []), el('th',{},'Gross'), el('th',{},'Dots')]));
        (r.playerIds||[]).slice().sort((a,b)=>(scoreOf(r,a).gross)-(scoreOf(r,b).gross)).forEach(pid=>{
          const t = scoreOf(r,pid).team;
          const teamCell = el('td',{},[t ? 'Team '+t : '–', (t && t===winnerNum) ? el('span',{class:'badge complete',style:'margin-left:6px;'},'Winner') : null]);
          table.appendChild(el('tr',{},[el('td',{},nameOf(r,pid)), ...(hasTeams ? [teamCell] : []), el('td',{},String(scoreOf(r,pid).gross)), el('td',{},String(scoreOf(r,pid).dots))]));
        });
        card.appendChild(table);
        if(resultText) card.appendChild(el('div',{style:'margin-top:8px;font-weight:600;font-size:14px;'}, resultText));
        card.appendChild(el('div',{style:'margin-top:12px;display:flex;gap:16px;'},[
          el('button',{class:'link-btn',onclick:(e)=>{ e.stopPropagation(); go('round-summary',{id:r.id}); }},'View payouts & teams'),
          el('button',{class:'link-btn',onclick:(e)=>{ e.stopPropagation(); editRound(r); }},'Edit'),
          confirmAction('round:'+r.id, 'Delete', async()=>{ expanded.delete(r.id); await deleteRoundDoc(r.id); })
        ]));
      }
      app.appendChild(card);
    }catch(err){
      app.appendChild(el('div',{class:'card'},[
        el('div',{style:'font-weight:700;'}, r.date || 'Round'),
        el('div',{class:'muted'},'This round has incomplete data and couldn\'t be displayed.'),
        confirmAction('round:'+r.id, 'Delete', async()=>{ await deleteRoundDoc(r.id); })
      ]));
    }
  });
}

function renderPlayerHistory(app){
  const rlist = finishedRounds();
  if(!rlist.length || !players.length){
    app.appendChild(el('div',{class:'card'},el('div',{class:'empty'},'No completed rounds yet — start one from the Start Round tab.')));
    return;
  }
  const chronological = rlist.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const pCard = el('div',{class:'card'});
  const scrollWrap = el('div',{style:'overflow-x:auto;'});
  const ptable = el('table',{class:'results',style:'white-space:nowrap;'});
  const headRow = el('tr',{},[el('th',{},'Player')]);
  chronological.forEach(r=> headRow.appendChild(el('th',{}, r.course ? r.course : r.date)));
  headRow.appendChild(el('th',{},'Total'));
  headRow.appendChild(el('th',{},'Average'));
  ptable.appendChild(headRow);
  const withTotals = players.map(p=>{
    let sum=0, count=0;
    chronological.forEach(r=>{
      const sc = r.scores && r.scores[p.id];
      if(sc && typeof sc.gross==='number'){ sum+=sc.gross; count++; }
    });
    return {p, sum, count};
  });
  withTotals.sort((a,b)=>{
    if(a.count===0 && b.count===0) return a.p.name.localeCompare(b.p.name);
    if(a.count===0) return 1;
    if(b.count===0) return -1;
    return a.sum-b.sum;
  });
  withTotals.forEach(({p,sum,count})=>{
    const tr = el('tr',{},[el('td',{style:'font-weight:600;'}, p.name)]);
    chronological.forEach(r=>{
      const sc = r.scores && r.scores[p.id];
      tr.appendChild(el('td',{}, sc ? String(sc.gross) : '—'));
    });
    tr.appendChild(el('td',{style:'font-weight:700;'}, count ? String(sum) : '—'));
    tr.appendChild(el('td',{style:'font-weight:700;'}, count ? (sum/count).toFixed(1) : '—'));
    ptable.appendChild(tr);
  });
  scrollWrap.appendChild(ptable);
  pCard.appendChild(scrollWrap);
  app.appendChild(pCard);
}

function renderRoundSummary(app){
  const round = rounds.find(r=>r.id===route.params.id);
  if(!round){ app.appendChild(el('div',{class:'card'},'Round not found.')); return; }
  const dots = computeDots(round);

  const head = el('div',{class:'card'});
  head.appendChild(el('div',{class:'row'},[
    el('h3',{style:'margin:0;'}, round.course ? `${round.date} — ${round.course}` : round.date),
    el('button',{class:'btn ghost small',onclick:()=>editRound(round)},'Edit scores')
  ]));
  const scoreTable = el('table',{class:'results'});
  scoreTable.appendChild(el('tr',{},[el('th',{},'Player'), el('th',{},'Gross'), el('th',{},'Dots')]));
  round.playerIds.slice().sort((a,b)=> (scoreOf(round,a).gross)-(scoreOf(round,b).gross)).forEach(pid=>{
    scoreTable.appendChild(el('tr',{},[el('td',{},nameOf(round,pid)), el('td',{},String(scoreOf(round,pid).gross)), el('td',{},String(scoreOf(round,pid).dots))]));
  });
  head.appendChild(scoreTable);
  app.appendChild(head);

  const dotsCard = el('div',{class:'card'});
  dotsCard.appendChild(el('h3',{},'Dot payouts'));
  const ordered = round.playerIds.slice().sort((a,b)=>dots.totals[b]-dots.totals[a]);
  ordered.forEach(pid=>{
    dotsCard.appendChild(el('div',{style:'margin-top:10px;'},[
      el('div',{style:'font-weight:700;'}, `${nameOf(round,pid)} — ${dots.totals[pid]} dots`)
    ]));
    const mine = dots.settlements.filter(s=>s.owes===pid || s.owed===pid)
      .slice()
      .sort((a,b)=>{
        const otherA = a.owes===pid ? a.owed : a.owes;
        const otherB = b.owes===pid ? b.owed : b.owes;
        return dots.totals[otherB]-dots.totals[otherA];
      });
    if(!mine.length){
      dotsCard.appendChild(el('div',{class:'muted',style:'padding:4px 0;'},'Even with everyone.'));
    } else {
      const ul = el('ul',{class:'settlement-list'});
      mine.forEach(s=>{
        if(s.owes===pid) ul.appendChild(el('li',{},[document.createTextNode('Owes '), el('span',{class:'money-neg'},fmt$(s.amount)), document.createTextNode(' to '+nameOf(round,s.owed))]));
        else ul.appendChild(el('li',{},[document.createTextNode('Owed '), el('span',{class:'money-pos'},fmt$(s.amount)), document.createTextNode(' by '+nameOf(round,s.owes))]));
      });
      dotsCard.appendChild(ul);
    }
  });
  app.appendChild(dotsCard);

  if(!window.__pendingConfirm) window.__pendingConfirm = new Set();
  const delKey = 'round:'+round.id;
  if(window.__pendingConfirm.has(delKey)){
    app.appendChild(el('div',{style:'display:flex;gap:10px;margin-top:6px;'},[
      el('button',{class:'btn danger',style:'flex:1;',onclick:async()=>{ window.__pendingConfirm.delete(delKey); await deleteRoundDoc(round.id); go('history'); }},'Yes, delete permanently'),
      el('button',{class:'btn ghost',style:'flex:1;',onclick:()=>{ window.__pendingConfirm.delete(delKey); render(); }},'Cancel')
    ]));
  } else {
    app.appendChild(el('button',{class:'btn danger',style:'width:100%;margin-top:6px;',onclick:()=>{ window.__pendingConfirm.add(delKey); render(); }},'Delete round'));
  }
}

function editRound(round){
  window.__newRoundState = {
    selected: new Set(round.playerIds),
    entries: Object.fromEntries(round.playerIds.map(pid=>{
      const s = scoreOf(round,pid);
      const entry = {gross: s.gross, dots: s.dots};
      if(typeof s.greenies==='number') entry.greenies = s.greenies;
      if(Array.isArray(s.holes)) entry.holes = s.holes;
      if(s.team) entry.team = s.team;
      return [pid, entry];
    })),
    date: round.date,
    course: round.course || '',
    editingId: round.id,
    error: null,
    importStatus: null,
    importError: null,
    importReview: null,
    nextTeam: Math.max(0, ...round.playerIds.map(pid=>(scoreOf(round,pid).team||0))) + 1
  };
  go('new-round');
}

init();
</script>
